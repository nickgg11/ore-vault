plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

// Gametests and data generators sit in their own source sets so they never ship in the jar.
sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
        exclude '.cache/**'
    }
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    datagen {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    server {
        argument '--nogui'
    }

    gameTestServer {
        modSource project.sourceSets.gametest
    }

    clientData {
        modSource project.sourceSets.datagen
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom localRuntime
    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
}

def runtimeProfile = project.findProperty('runtime_profile') ?: 'none'
if (!(runtimeProfile in ['none', 'ultimine', 'materials'])) {
    throw new GradleException("runtime_profile must be none, ultimine or materials, not '${runtimeProfile}'")
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    implementation "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}"
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
    testCompileOnly "org.jspecify:jspecify:${jspecify_version}"

    localRuntime "mezz.jei:jei-26.1.2-neoforge:${jei_version}"
    if (runtimeProfile == 'ultimine') {
        localRuntime "dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}"
    }
    if (runtimeProfile == 'materials') {
        localRuntime "dev.ftb.mods:ftb-materials:${ftb_materials_version}"
    }

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunit_version}"
    testImplementation "com.google.code.gson:gson:${gson_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The repository guards read the source tree, and the run directory is not the project.
    systemProperty 'orevault.projectDir', project.projectDir.absolutePath
    // Declared so a change to these reruns the guards rather than taking a cached result.
    inputs.dir('src/main').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('src/gametest').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('src/datagen').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('src/generated').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

// Fails when the data generators write anything that differs from what is committed (E1-S9, #198).
abstract class CheckGeneratedResources extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void check() {
        def status = new ByteArrayOutputStream()
        execOperations.exec {
            commandLine 'git', 'status', '--porcelain', '--', 'src/generated'
            standardOutput = status
        }
        if (!status.toString().isBlank()) {
            throw new GradleException("Generated resources differ from the committed ones; run runClientData and commit: ${status}")
        }
    }
}

def checkGeneratedResources = tasks.register('checkGeneratedResources', CheckGeneratedResources) {
    dependsOn tasks.named('runClientData')
}

tasks.named('check') {
    dependsOn tasks.named('compileGametestJava'), checkGeneratedResources
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            ftb_teams_version      : ftb_teams_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
