# Ore Vault — NeoForge mod metadata (Minecraft 26.1)
# Values in ${...} are expanded by the Gradle build.
license="${mod_license}"
issueTrackerURL="https://example.invalid/orevault/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="FTB Teams for the team framework."
description='''
${mod_description}
'''
logoFile="orevault.png"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Hard dependency: the mod will not load without FTB Teams.
[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="required"
    versionRange="[26.1.2.4,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependency: Ultimine-specific nodes and hooks activate only when present.
[[dependencies.${mod_id}]]
    modId="ftbultimine"
    type="optional"
    versionRange="[26.1,)"
    ordering="NONE"
    side="BOTH"

# Soft dependency: extra Ore Doubling tiers activate only when present.
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="optional"
    versionRange="[26.1,)"
    ordering="NONE"
    side="BOTH"
