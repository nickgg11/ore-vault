# Placeholders are expanded from gradle.properties during processResources.

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# E3-S6a (#237). FML 11.0.15 reads the default path when this list is absent and only this list when it is present
# (ModFile, ModFileParser#getAccessTransformers), so the file is named here once and loaded once.
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="required"
    versionRange="[${ftb_teams_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbultimine"
    type="optional"
    ordering="AFTER"
    side="BOTH"
