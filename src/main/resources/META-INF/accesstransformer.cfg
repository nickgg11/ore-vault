# Ore Vault access transformers.
#
# Syntax: <visibility> <fully-qualified-class> <member> [descriptor]
#
# [14] OreClassifier: MC 26.1 placement classes expose no public accessors for
# the metrics the rarity scan needs (vein count, height range).
public net.minecraft.world.level.levelgen.placement.CountPlacement count
public net.minecraft.world.level.levelgen.placement.HeightRangePlacement height
public net.minecraft.world.level.levelgen.heightproviders.UniformHeight minInclusive
public net.minecraft.world.level.levelgen.heightproviders.UniformHeight maxInclusive
# [13] VaultDimensions: dynamic per-team ServerLevel creation needs the level
# storage access (mirrors what MinecraftServer#createLevels does internally).
public net.minecraft.server.MinecraftServer storageSource
# [140] (issue #140) Long Delve reduces hunger drain by a percentage. Vanilla has
# neither an event for exhaustion nor a getter for it — FoodData exposes only
# addExhaustion — so taking a share off each rise needs the field. Read and written
# on the server tick only; nothing else in the mod touches it.
public net.minecraft.world.food.FoodData exhaustionLevel
