# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Point toolchain auto-detection at the locally installed JDK 25 (Temurin).
org.gradle.java.installations.paths=E:/Github/Ore-Vault_2/.tools/jdk25/jdk-25.0.4.1+1

# Environment Properties
# Pinned 2026-08-26: latest stable NeoForge for Minecraft 26.1.
minecraft_version=26.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.99

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=orevault
# The human-readable display name for the mod.
mod_name=Ore Vault
# The license of the mod.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod.
mod_group_id=com.orevault
# Author metadata displayed in the mod UI.
mod_authors=Ore Vault Team
mod_description=A per-team mining dimension with dramatically increased ore density, shared Resonance/Animus skill trees, and opt-in mob farming via Disturbed Zones.

